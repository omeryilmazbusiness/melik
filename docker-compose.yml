services:
  postgres:
    image: postgres:16-alpine
    container_name: melik-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: melik
      POSTGRES_PASSWORD: melik_dev_password
      POSTGRES_DB: melik_store
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U melik -d melik_store"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
